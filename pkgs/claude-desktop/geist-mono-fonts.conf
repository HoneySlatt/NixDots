<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Swaps the system UI font for Geist Mono in the apps launched with it (Claude Desktop) -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="same"><family>Geist</family><prefer><family>Geist Mono</family></prefer></alias>
</fontconfig>
