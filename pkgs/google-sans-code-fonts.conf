<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Swaps the system UI font for Google Sans Code in the apps launched with it (Claude Desktop) -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="same"><family>Google Sans Flex</family><prefer><family>Google Sans Code</family></prefer></alias>
</fontconfig>
